<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📁 文件索引</title>
<style>
/* 若你的 cmdysj 字体不在 ./miscellaneous/ 下，改这个路径或整段删掉，会自动回退到系统衬线体 */
@font-face{
  font-family: "cmdysj";
  src: local("cmdysj"),
       url("./miscellaneous/cmdysj.ttf") format("truetype");
  font-display: swap;
}

:root{
  /* 参照 styles.css 的调色板 */
  --night: #17141f;
  --ink: #29202d;
  --plum: #493744;
  --gold: #e7ad62;
  --ember: #bd684e;
  --mist: rgba(226, 201, 197, 0.76);
  --mist-light: rgba(246, 225, 211, 0.92);

  /* 兼容原代码的变量名，其余 CSS 不动 */
  --bg: #17141f;
  --panel: rgba(41, 32, 45, 0.72);
  --panel2: rgba(73, 55, 68, 0.55);
  --border: rgba(231, 173, 98, 0.22);
  --fg: rgba(246, 225, 211, 0.92);
  --dim: rgba(226, 201, 197, 0.62);
  --accent: #e7ad62;
  --hover: rgba(231, 173, 98, 0.1);
  --sel: rgba(231, 173, 98, 0.16);
  --sel-border: rgba(231, 173, 98, 0.6);
  --link: #e7ad62;
  --local: #bd684e;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}

body{
  font-family: "cmdysj", "Noto Serif SC", "Songti SC", Georgia, serif;
  background:
    radial-gradient(circle at 50% 0%, rgba(231, 173, 98, 0.14), transparent 42rem),
    radial-gradient(circle at 100% 100%, rgba(189, 104, 78, 0.08), transparent 32rem),
    linear-gradient(135deg, #17141f 0%, #241a24 55%, #473039 100%);
  background-attachment: fixed;
  color: var(--fg);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before{
  position: fixed; inset: 0; z-index: -1; content: "";
  background: radial-gradient(circle at 50% 8%, rgba(231, 173, 98, 0.1), transparent 30rem);
  pointer-events: none;
}

::-webkit-scrollbar{ width: 10px; height: 10px; }
::-webkit-scrollbar-track{ background: transparent; }
::-webkit-scrollbar-thumb{
  background: rgba(231, 173, 98, 0.22);
  border-radius: 999px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover{
  background: rgba(231, 173, 98, 0.42);
  background-clip: padding-box;
}

header{
  position: sticky; top: 0; z-index: 100;
  background: rgba(23, 20, 31, 0.78);
  backdrop-filter: blur(16px) saturate(120%);
  -webkit-backdrop-filter: blur(16px) saturate(120%);
  border-bottom: 1px solid rgba(231, 173, 98, 0.18);
  padding: 12px 20px;
  box-shadow: 0 0.8rem 2rem rgba(11, 8, 16, 0.28);
}
.hd{max-width:1200px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{
  font-size: 16px; font-weight: 700; white-space: nowrap; letter-spacing: 0.12em;
  color: var(--mist-light); text-shadow: 0 2px 12px rgba(9, 7, 14, 0.6);
}
.logo b{
  background: linear-gradient(120deg, #f3c985, #e7ad62 60%, #bd684e);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--gold);
}
.searchwrap{flex:1;position:relative;min-width:160px}
.searchwrap::before{
  content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: 13px; opacity: 0.7; pointer-events: none;
}
#q{
  width: 100%; padding: 8px 14px 8px 36px;
  border-radius: 999px;
  border: 1px solid rgba(231, 173, 98, 0.28);
  background: rgba(41, 32, 45, 0.6);
  color: var(--fg);
  font-size: 14px; font-family: inherit; outline: none;
  transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
}
#q::placeholder{ color: rgba(226, 201, 197, 0.45); }
#q:focus{
  border-color: var(--gold);
  background: rgba(23, 20, 31, 0.82);
  box-shadow: 0 0 0 3px rgba(231, 173, 98, 0.16), 0 0 18px rgba(231, 173, 98, 0.12);
}
.actions{display:flex;gap:6px}
body[data-view="explorer"] .actions{display:none}
.btn{
  background: rgba(41, 32, 45, 0.6);
  border: 1px solid rgba(231, 173, 98, 0.32);
  color: var(--mist);
  border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font-size: 13px; line-height: 1;
  font-family: inherit; white-space: nowrap;
  transition: color 180ms ease, background 180ms ease, border-color 180ms ease, transform 180ms ease;
}
.btn:hover{
  background: var(--gold); color: var(--ink);
  border-color: var(--gold); transform: translateY(-1px);
}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn:disabled:hover{background:rgba(41,32,45,.6);color:var(--mist);border-color:rgba(231,173,98,.32)}
.btn.icon-only{padding:6px 9px}
.src{
  font-size: 11px; color: var(--dim);
  border: 1px solid rgba(231, 173, 98, 0.22); border-radius: 20px;
  padding: 2px 12px; white-space: nowrap;
  max-width: 42vw; overflow: hidden; text-overflow: ellipsis;
  background: rgba(41, 32, 45, 0.35);
}
.src.ok{ color: var(--gold); border-color: rgba(231, 173, 98, 0.45); }
main{max-width:1200px;margin:0 auto;padding:18px 20px 60px}

/* ============ 树形视图 ============ */
.tree{
  background: var(--panel);
  border: 1px solid rgba(231, 173, 98, 0.18);
  border-radius: 16px;
  padding: 10px 6px;
  box-shadow: 0 1rem 3rem rgba(11, 8, 16, 0.36);
  backdrop-filter: blur(0.7rem);
  -webkit-backdrop-filter: blur(0.7rem);
  animation: panel-in 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes panel-in {
  from { opacity: 0; transform: translateY(0.6rem); }
  to   { opacity: 1; transform: translateY(0); }
}

details.dir{margin:0}
details.dir>summary{
  list-style:none;cursor:pointer;padding:5px 12px;border-radius:9px;
  display:flex;align-items:center;gap:8px;font-weight:600;
  user-select:none;
  transition: background 160ms ease, color 160ms ease;
}
details.dir>summary::-webkit-details-marker{display:none}
details.dir>summary:hover{
  background: linear-gradient(90deg, rgba(231, 173, 98, 0.12), transparent 90%);
  color: var(--gold);
}
details.dir>summary::before{
  content:""; width:0; height:0;
  border-left: 5px solid rgba(231, 173, 98, 0.55);
  border-top: 4px solid transparent; border-bottom: 4px solid transparent;
  transition: transform 200ms ease, border-left-color 160ms ease;
  flex-shrink: 0;
}
details.dir[open]>summary::before{transform: rotate(90deg); border-left-color: var(--gold);}
details.dir[open]>summary{ color: var(--mist-light); }
details.dir[open]>summary:hover{ color: var(--gold); }
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{
  font-size: 11px; color: var(--gold);
  background: rgba(231, 173, 98, 0.1);
  border: 1px solid rgba(231, 173, 98, 0.3);
  padding: 0 8px; border-radius: 20px;
  font-weight: 400; flex-shrink: 0;
}
.kids{
  margin-left: 16px;
  border-left: 1px solid rgba(231, 173, 98, 0.16);
  padding-left: 6px;
}

a.file{
  display:flex;align-items:center;gap:8px;padding:4px 12px;margin:1px 0;
  border-radius:9px;text-decoration:none;color:var(--fg);
  transition: background 160ms ease, color 160ms ease, transform 160ms ease;
}
a.file:hover{
  background: linear-gradient(90deg, rgba(231, 173, 98, 0.14), rgba(231, 173, 98, 0.02));
  color: var(--gold);
  transform: translateX(2px);
}
a.file .ic{font-size:13px;flex-shrink:0;opacity:.85}
a.file .nm{font-weight:400;font-size:13.5px}
a.file:hover .nm{text-decoration:underline;text-underline-offset:3px;text-decoration-color: rgba(231,173,98,.6)}
a.file.local-link{color:var(--fg)}
a.file.local-link:hover{color:var(--local)}
a.file.local-link:hover .nm{text-decoration:none;color:var(--local)}
a.file.ext-link .nm{color:var(--gold)}
a.file.ext-link:hover .nm{color:#f3c985}
.ext-badge{
  font-size: 10px; padding: 1px 7px; border-radius: 999px; flex-shrink: 0;
  background: rgba(231, 173, 98, 0.12);
  color: var(--gold);
  border: 1px solid rgba(231, 173, 98, 0.4);
  font-weight: 400;
}
.ext-badge.local{
  background: rgba(189, 104, 78, 0.12);
  color: var(--local);
  border-color: rgba(189, 104, 78, 0.42);
}

/* ============ 资源管理器 ============ */
.explorer{
  background: var(--panel);
  border: 1px solid rgba(231, 173, 98, 0.18);
  border-radius: 16px;
  overflow: hidden; display: flex; flex-direction: column; min-height: 60vh;
  box-shadow: 0 1rem 3rem rgba(11, 8, 16, 0.36);
  backdrop-filter: blur(0.7rem);
  -webkit-backdrop-filter: blur(0.7rem);
  animation: panel-in 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.exp-toolbar{
  display:flex;align-items:center;gap:6px;padding:9px 12px;
  background: rgba(23, 20, 31, 0.55);
  border-bottom: 1px solid rgba(231, 173, 98, 0.16);
  flex-wrap: wrap;
}
.nav-btn{
  background: rgba(41, 32, 45, 0.6);
  border: 1px solid rgba(231, 173, 98, 0.28);
  color: var(--fg);
  width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;
  transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
}
.nav-btn:hover:not(:disabled){ background: var(--gold); color: var(--ink); border-color: var(--gold); }
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.breadcrumb{
  flex:1;display:flex;align-items:center;gap:2px;flex-wrap:wrap;
  background: rgba(23, 20, 31, 0.55);
  border: 1px solid rgba(231, 173, 98, 0.2);
  border-radius: 9px;
  padding: 2px 10px; min-height: 32px; min-width: 200px;
}
.crumb{
  padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 13px;
  color: var(--fg); transition: color 160ms ease, background 160ms ease;
  white-space: nowrap;
}
.crumb:hover{ background: var(--hover); color: var(--gold); }
.crumb.current{ font-weight: 600; cursor: default; color: var(--gold); }
.crumb.current:hover{ background: transparent; color: var(--gold); }
.crumb-sep{ color: rgba(231, 173, 98, 0.5); font-size: 12px; user-select: none; }
.toolbar-right{display:flex;gap:6px;align-items:center}
.sort-select{
  background: rgba(41, 32, 45, 0.6);
  border: 1px solid rgba(231, 173, 98, 0.28);
  color: var(--fg);
  border-radius: 9px; padding: 5px 10px; font-size: 13px; font-family: inherit;
  cursor: pointer; outline: none; height: 32px;
  transition: border-color 160ms ease;
}
.sort-select:focus{ border-color: var(--gold); box-shadow: 0 0 0 3px rgba(231,173,98,.14); }
.sort-select option{ background: #241a24; color: var(--fg); }
.view-toggle{
  background: rgba(41, 32, 45, 0.6);
  border: 1px solid rgba(231, 173, 98, 0.28);
  color: var(--dim);
  width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;
  transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
}
.view-toggle:hover{ color: var(--fg); border-color: var(--gold); }
.view-toggle.active{
  background: rgba(231, 173, 98, 0.18);
  color: var(--gold);
  border-color: var(--sel-border);
}

.exp-body{display:flex;flex:1;min-height:0}
.exp-sidebar{
  width: 250px; flex-shrink: 0;
  border-right: 1px solid rgba(231, 173, 98, 0.14);
  overflow-y: auto; max-height: calc(60vh + 200px);
  padding: 8px 6px;
  background: rgba(23, 20, 31, 0.32);
}
.exp-sidebar:empty{display:none}
.nav-dir{margin:0}
.nav-dir>summary{
  list-style:none;cursor:pointer;padding:4px 10px;border-radius:8px;
  display:flex;align-items:center;gap:6px;font-size:13px;
  user-select:none;
  overflow:hidden;white-space:nowrap;
  transition: background 160ms ease, color 160ms ease;
}
.nav-dir>summary::-webkit-details-marker{display:none}
.nav-dir>summary:hover{ background: var(--hover); color: var(--gold); }
.nav-dir>summary::before{
  content:"";width:0;height:0;flex-shrink:0;
  border-left: 5px solid rgba(231, 173, 98, 0.55);
  border-top: 4px solid transparent;border-bottom: 4px solid transparent;
  transition: transform 200ms ease;
}
.nav-dir[open]>summary::before{transform:rotate(90deg)}
.nav-dir>summary.selected{
  background: rgba(231, 173, 98, 0.16);
  color: var(--gold);
  box-shadow: inset 2px 0 0 var(--gold);
}
.nav-kids{
  margin-left: 14px;
  border-left: 1px solid rgba(231, 173, 98, 0.12);
  padding-left: 4px;
}
.nav-name{overflow:hidden;text-overflow:ellipsis}

.exp-main{flex:1;overflow-y:auto;min-height:40vh;max-height:calc(60vh + 200px);outline:none}

/* 列表视图 */
.list-view{width:100%;border-collapse:collapse;font-size:13.5px}
.list-view thead th{
  text-align: left; padding: 9px 14px;
  background: rgba(23, 20, 31, 0.7);
  border-bottom: 1px solid rgba(231, 173, 98, 0.2);
  font-weight: 600; font-size: 12px;
  color: var(--gold);
  position: sticky; top: 0; z-index: 1; cursor: pointer; user-select: none;
  white-space: nowrap; letter-spacing: 0.06em;
  backdrop-filter: blur(6px);
}
.list-view thead th:hover{ color: #f3c985; }
.list-view thead th .sort-arrow{ color: var(--gold); margin-left: 4px; }
.list-view tbody tr{cursor:default; transition: background 140ms ease, box-shadow 140ms ease;}
.list-view tbody tr:hover{ background: var(--hover); }
.list-view tbody tr.selected{
  background: linear-gradient(90deg, rgba(231, 173, 98, 0.18), rgba(231, 173, 98, 0.04));
  box-shadow: inset 2px 0 0 var(--gold);
}
.list-view td{padding:7px 14px;border-bottom:1px solid rgba(231, 173, 98, 0.06)}
.list-view td.name-cell{display:flex;align-items:center;gap:8px;min-width:0}
.list-view td.name-cell .ic{flex-shrink:0}
.list-view td.name-cell .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-view td.type-cell{color:var(--dim);font-size:12.5px;white-space:nowrap;width:150px}
.list-view tr[data-link="url"] td.name-cell .nm{ color: var(--gold); }
.list-view tr[data-link="app"] td.name-cell .nm,
.list-view tr[data-link="dir"] td.name-cell .nm{ color: var(--local); }

/* 图标视图 */
.icon-view{
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px; padding: 14px;
}
.icon-item{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding: 14px 8px; border-radius: 12px; cursor: default;
  overflow: hidden;
  border: 1px solid transparent;
  transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
}
.icon-item:hover{
  background: var(--hover);
  border-color: rgba(231, 173, 98, 0.22);
  transform: translateY(-2px);
}
.icon-item.selected{
  background: rgba(231, 173, 98, 0.14);
  border-color: var(--sel-border);
}
.icon-item .big-icon{
  font-size: 36px; line-height: 1;
  filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.45)) drop-shadow(0 0 8px rgba(231, 173, 98, 0.15));
}
.icon-item .icon-label{
  font-size:12.5px;text-align:center;word-break:break-all;
  max-height:2.8em;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
}

.exp-empty{padding:40px 20px;text-align:center;color:var(--dim);font-size:13px}

/* ============ 设置对话框 ============ */
dialog#settings{
  border: 1px solid rgba(231, 173, 98, 0.35);
  background: rgba(41, 32, 45, 0.94);
  backdrop-filter: blur(16px) saturate(120%);
  -webkit-backdrop-filter: blur(16px) saturate(120%);
  color: var(--fg);
  border-radius: 16px; padding: 0;
  max-width: 480px; width: calc(100vw - 40px);
  box-shadow: 0 1.5rem 4rem rgba(11, 8, 16, 0.6);
}
dialog#settings::backdrop{ background: rgba(11, 8, 16, 0.62); backdrop-filter: blur(3px); }
.dlg-header{
  display:flex;align-items:center;justify-content:space-between;
  padding: 15px 20px;
  border-bottom: 1px solid rgba(231, 173, 98, 0.2);
}
.dlg-header h3{font-size:15px;font-weight:600;color:var(--gold);letter-spacing:0.06em}
.dlg-close{
  background: transparent; border: none; color: var(--dim); font-size: 18px;
  cursor: pointer; padding: 2px 9px; border-radius: 8px;
  transition: background 160ms ease, color 160ms ease;
}
.dlg-close:hover{ background: var(--hover); color: var(--gold); }
.dlg-body{padding:18px 20px;display:flex;flex-direction:column;gap:20px}
.fieldset{border:none}
.fieldset legend{
  font-size: 12px; color: var(--gold); letter-spacing: 0.12em; margin-bottom: 10px;
  text-transform: uppercase; opacity: 0.85;
}
.radio-group{display:flex;flex-direction:column;gap:8px}
.radio-group label{
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  padding: 11px 14px;
  border: 1px solid rgba(231, 173, 98, 0.18);
  border-radius: 10px;
  transition: background 160ms ease, border-color 160ms ease;
}
.radio-group label:hover{ background: var(--hover); border-color: rgba(231, 173, 98, 0.4); }
.radio-group label:has(input:checked){
  background: rgba(231, 173, 98, 0.12);
  border-color: var(--sel-border);
}
.radio-group input{ accent-color: var(--gold); cursor: pointer; }
.radio-group .opt-name{ font-weight: 600; font-size: 13.5px; color: var(--mist-light); }
.radio-group .opt-desc{ font-size: 11.5px; color: var(--dim); margin-top: 2px; }
.select-wrap{display:flex;align-items:center;gap:10px;font-size:13px}
.select-wrap select{
  flex: 1;
  background: rgba(23, 20, 31, 0.7);
  border: 1px solid rgba(231, 173, 98, 0.28);
  color: var(--fg);
  border-radius: 9px; padding: 7px 12px; font-size: 13px; font-family: inherit;
  cursor: pointer; outline: none;
  transition: border-color 160ms ease;
}
.select-wrap select:focus{ border-color: var(--gold); }
.select-wrap select option{ background: #241a24; color: var(--fg); }

/* ============ 状态 / Toast ============ */
.hide{display:none!important}
#status{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px}
.spinner{
  width:30px;height:30px;
  border: 3px solid rgba(231, 173, 98, 0.16);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 16px;
  box-shadow: 0 0 18px rgba(231, 173, 98, 0.2);
}
@keyframes spin{to{transform:rotate(360deg)}}
#empty{text-align:center;color:var(--dim);padding:60px 20px}
#toast{
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(41, 32, 45, 0.94);
  border: 1px solid rgba(231, 173, 98, 0.55);
  color: #fff0df;
  padding: 11px 20px;
  border-radius: 10px; font-size: 13px; line-height: 1.5;
  opacity: 0; pointer-events: none;
  transition: opacity 220ms ease, transform 220ms ease;
  z-index: 999;
  max-width: calc(100vw - 40px); word-break: break-all;
  box-shadow: 0 0.8rem 2rem rgba(11, 8, 16, 0.55);
  backdrop-filter: blur(12px);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{
  text-align: center; color: var(--dim); font-size: 12px;
  padding: 14px 20px 40px;
  letter-spacing: 0.04em;
}
kbd{
  background: rgba(41, 32, 45, 0.7);
  border: 1px solid rgba(231, 173, 98, 0.28);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 6px; font-size: 11px; font-family: inherit;
  color: var(--gold);
}
code{
  background: rgba(41, 32, 45, 0.7);
  border: 1px solid rgba(231, 173, 98, 0.16);
  padding: 1px 6px; border-radius: 5px; font-size: 12px;
  color: #f3c985;
}
@media(max-width:700px){
  .kids{margin-left:8px;padding-left:4px}
  .src{display:none}
  .exp-sidebar{width:180px}
  .breadcrumb{min-width:120px}
  .list-view td.type-cell{display:none}
  .list-view thead th.col-type{display:none}
  body{background-attachment: scroll;}
}
</style>
</head>
<body data-view="tree">

<header>
  <div class="hd">
    <div class="logo">📁 <b>文件索引</b></div>
    <div class="searchwrap">
      <input id="q" type="search" placeholder="搜索文件…  ( 按 / 聚焦 )" autocomplete="off" spellcheck="false">
    </div>
    <div class="actions">
      <button class="btn" id="expandAll" title="全部展开">⊞ 展开</button>
      <button class="btn" id="collapseAll" title="全部收起">⊟ 收起</button>
    </div>
    <button class="btn icon-only" id="openSettings" title="设置">⚙️</button>
    <div class="src" id="src">加载中…</div>
  </div>
</header>

<main>
  <div id="status"><div class="spinner"></div>正在加载文件索引…</div>

  <div class="tree" id="tree" hidden></div>

  <div class="explorer" id="explorer" hidden>
    <div class="exp-toolbar">
      <button class="nav-btn" id="navBack" title="后退">←</button>

<script>
/* ============================================================
   配置与常量
   ============================================================ */
const CONFIG = {
  owner: '', repo: '', branch: '',
  sources: ['index.json', 'api', 'folder_structure.txt'],
  ignoreFile: '.indexignore',
  applyIgnoreFile: true,
  linkMapFile: 'lnk.json',
};

const SELF_FILES = new Set(['index.html', 'index.json', '.indexignore', 'gen_index.py', 'gen_lnk_json.py', 'lnk.json']);

const STORAGE = {
  tree:    'file-index:tree-state',
  nav:     'file-index:explorer-nav',
  view:    'file-index:view-mode',
  exp:     'file-index:explorer-state',
  expView: 'file-index:explorer-view',
  searchScope: 'file-index:search-scope',
};

/* ============================================================
   基础工具
   ============================================================ */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function lsGet(key, fallback){
  try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
  catch { return fallback; }
}
function lsSet(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(_){}
}

const FILE_ICONS = {
  exe:'⚙️',msi:'⚙️',zip:'🗜️',rar:'🗜️','7z':'🗜️',apk:'📱',
  mp3:'🎵',flac:'🎵',wav:'🎵',lrc:'🎼',
  mp4:'🎬',mkv:'🎬',avi:'🎬',wtv:'🎬',mov:'🎬',webm:'🎬',
  png:'🖼️',jpg:'🖼️',jpeg:'🖼️',gif:'🖼️',webp:'🖼️',bmp:'🖼️',ico:'🖼️',jfif:'🖼️',svg:'🖼️',
  txt:'📄',md:'📝',pdf:'📕',pptx:'📊',docx:'📘',xlsx:'📗',
  json:'🧾',html:'🌐',htm:'🌐',xml:'🧾',url:'🔗',
  lnk:'🔗',cmd:'⌨️',bat:'⌨️',ps1:'⌨️',py:'🐍',js:'🟨',css:'🎨',
  ttf:'🔤',otf:'🔤',ani:'🖱️',cur:'🖱️',inf:'⚙️',
  dll:'📦',pdb:'📦',config:'⚙️'
};
const TYPE_LABELS = {
  exe:'应用程序',msi:'安装包',zip:'压缩文件',rar:'压缩文件','7z':'压缩文件',
  apk:'安卓应用',mp3:'音频文件',flac:'音频文件',wav:'音频文件',lrc:'歌词文件',
  mp4:'视频文件',mkv:'视频文件',avi:'视频文件',wtv:'视频文件',
  png:'PNG 图片',jpg:'JPG 图片',jpeg:'JPEG 图片',gif:'GIF 动图',
  webp:'WebP 图片',bmp:'BMP 图片',ico:'图标',jfif:'图片',svg:'SVG 图片',
  txt:'文本文档',md:'Markdown',pdf:'PDF 文档',pptx:'演示文稿',
  docx:'Word 文档',xlsx:'Excel 表格',json:'JSON',html:'HTML',xml:'XML',url:'网页链接',
  lnk:'快捷方式',cmd:'命令脚本',bat:'批处理',ps1:'PowerShell',py:'Python',
  js:'JavaScript',css:'样式表',ttf:'字体',otf:'字体',ani:'动态光标',cur:'光标',
  inf:'安装信息',dll:'动态库',pdb:'调试符号',config:'配置文件'
};
function extOf(name){
  const i = name.lastIndexOf('.');
  return i > -1 ? name.slice(i + 1).toLowerCase() : '';
}
function iconFor(name){
  return FILE_ICONS[extOf(name)] || '📄';
}

/* ============================================================
   lnk.json：快捷方式映射
   ============================================================ */
let linkMap = {};

function normalizeLinkMap(raw){
  const map = {};
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return map;
  for (const [k, v] of Object.entries(raw)){
    let key = String(k).replace(/\\/g, '/').replace(/^\/+/, '');
    if (typeof v === 'string'){
      map[key] = { type: 'url', target: v };
    } else if (v && typeof v === 'object'){
      if (v.url){
        map[key] = { type: 'url', target: String(v.url) };
      } else if (v.target){
        const t = String(v.target);
        const type = v.type === 'app' || v.type === 'dir' ? v.type
                   : (/^(https?|ftp|mailto):/i.test(t) ? 'url' : 'url');
        map[key] = { type, target: t };
      }
    }
  }
  return map;
}

async function loadLinkMap(){
  try{
    const res = await fetch(CONFIG.linkMapFile, {cache: 'no-cache'});
    if (!res.ok) return {};
    return await res.json();
  }catch(_){ return {}; }
}

function typeLabelFor(node, path){
  if (node.children) return '文件夹';
  const link = linkMap[path];
  if (link){
    if (link.type === 'url') return '网页链接';
    if (link.type === 'app') return '本地程序';
    if (link.type === 'dir') return '本地文件夹';
  }
  const ext = extOf(node.name);
  return TYPE_LABELS[ext] || (ext ? ext.toUpperCase() + ' 文件' : '文件');
}
function iconForNode(node, path){
  if (node.children) return '📁';
  const link = linkMap[path];
  if (link){
    if (link.type === 'url') return '🌐';
    if (link.type === 'app') return '🖥️';
    if (link.type === 'dir') return '📂';
  }
  return iconFor(node.name);
}

/* ============================================================
   Toast / 剪贴板
   ============================================================ */
let toastTimer = null;
function showToast(msg){
  let t = document.getElementById('toast');
  if (!t){
    t = document.createElement('div');
    t.id = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
async function copyText(text){
  try{
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(_){}
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(_){}
  document.body.removeChild(ta);
  return true;
}

/* ============================================================
   .indexignore
   ============================================================ */
const RE_ESCAPE = /[\\^$.*+?()[\]{}|]/g;
const escapeRe = s => s.replace(RE_ESCAPE, '\\$&');

class IgnoreRule {
  constructor(line){
    let p = line;
    this.negate = p.startsWith('!');
    if (this.negate) p = p.slice(1);
    this.dirOnly = p.endsWith('/');
    if (this.dirOnly) p = p.slice(0, -1);
    this.rootOnly = p.startsWith('/');
    if (this.rootOnly) p = p.slice(1);
    this.hasSlash = p.includes('/');
    this.regex = new RegExp('^' + this._compile(p) + '$');
  }
  _compile(pat){
    let out = '', i = 0;
    while (i < pat.length){
      const c = pat[i];
      if (c === '*'){
        if (pat[i + 1] === '*'){
          if (pat[i + 2] === '/'){ out += '(?:.*/)?'; i += 3; }
          else                   { out += '.*';       i += 2; }
        } else                   { out += '[^/]*';    i += 1; }
      }
      else if (c === '?'){ out += '[^/]'; i += 1; }
      else if (c === '['){
        let j = i + 1;
        if (pat[j] === '!' || pat[j] === '^') j++;
        if (pat[j] === ']') j++;
        while (j < pat.length && pat[j] !== ']') j++;
        if (j >= pat.length){ out += '\\['; i += 1; }
        else {
          let stuff = pat.slice(i + 1, j);
          if (stuff.startsWith('!')) stuff = '^' + stuff.slice(1);
          out += '[' + stuff + ']';
          i = j + 1;
        }
      }
      else if (c === '\\' && i + 1 < pat.length){
        out += escapeRe(pat[i + 1]); i += 2;
      }
      else { out += escapeRe(c); i += 1; }
    }
    return out;
  }
  match(relpath, isDir){
    if (this.dirOnly && !isDir) return false;
    if (this.rootOnly || this.hasSlash) return this.regex.test(relpath);
    return this.regex.test(relpath.split('/').pop());
  }
}
function isIgnored(relpath, isDir, rules){
  let ignored = false;
  for (const r of rules) if (r.match(relpath, isDir)) ignored = !r.negate;
  return ignored;
}
async function loadIgnoreRules(url){
  try{
    const res = await fetch(url, {cache: 'no-cache'});
    if (!res.ok) return [];
    const text = await res.text();
    const rules = [];
    for (let line of text.split(/\r?\n/)){
      line = line.replace(/(?<!\\)\s+$/, '');
      if (!line.trim() || line.startsWith('#')) continue;
      rules.push(new IgnoreRule(line));
    }
    return rules;
  } catch(_){ return []; }
}
function filterTree(nodes, parentPath, rules){
  const out = [];
  for (const node of nodes){
    const p = parentPath ? parentPath + '/' + node.name : node.name;
    const isDir = !!node.children;
    if (!parentPath && !isDir && SELF_FILES.has(node.name)) continue;
    if (isIgnored(p, isDir, rules)) continue;
    if (isDir) out.push({name: node.name, children: filterTree(node.children, p, rules)});
    else       out.push({name: node.name});
  }
  return out;
}

/* ============================================================
   数据源
   ============================================================ */
function detectRepo(){
  const o = CONFIG.owner.trim(), r = CONFIG.repo.trim();
  if (o && r) return {owner: o, repo: r};
  const host = location.hostname;
  if (!host.endsWith('.github.io')) return null;
  const owner = host.slice(0, -'.github.io'.length);
  const segs = location.pathname.split('/').filter(Boolean);
  const repo = (segs.length && !segs[0].includes('.')) ? segs[0] : `${owner}.github.io`;
  return {owner, repo};
}
async function loadFromAPI(){
  const info = detectRepo();
  if (!info) throw new Error('未识别到仓库，请在 CONFIG 里填 owner/repo');
  const {owner, repo} = info;
  const repoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {
    headers: {'Accept': 'application/vnd.github+json'}
  });
  if (!repoRes.ok){
    if (repoRes.status === 403) throw new Error('API 速率超限');
    if (repoRes.status === 404) throw new Error('仓库不存在或为私有');
    throw new Error('API ' + repoRes.status);
  }
  const repoInfo = await repoRes.json();
  const branch = CONFIG.branch || repoInfo.default_branch || 'main';
  const treeRes = await fetch(
    `https://api.github.com/repos/${owner}/${repo}/git/trees/${encodeURIComponent(branch)}?recursive=1`,
    {headers: {'Accept': 'application/vnd.github+json'}}
  );
  if (!treeRes.ok) throw new Error('获取文件树失败 ' + treeRes.status);
  const treeData = await treeRes.json();
  const paths = (treeData.tree || []).filter(x => x.type === 'blob').map(x => x.path);
  if (!paths.length) throw new Error('仓库中没有文件');
  return {
    nodes: treeFromPaths(paths),
    label: `GitHub API · ${owner}/${repo}@${branch}` + (treeData.truncated ? '（已截断）' : '')
  };
}
function treeFromPaths(paths){
  const root = {children: [], _map: new Map()};
  for (const p of paths){
    const parts = p.split('/');
    let cur = root;
    for (let i = 0; i < parts.length; i++){
      const isFile = i === parts.length - 1;
      const part = parts[i];
      let node = cur._map.get(part);
      if (!node){
        node = {name: part};
        if (!isFile) node.children = [];
        cur._map.set(part, node);
        cur.children.push(node);
      } else if (!isFile && !node.children){
        node.children = [];
      }
      if (!isFile){
        if (!node._map) node._map = new Map();
        cur = node;
      }
    }
  }
  const strip = n => { delete n._map; if (n.children) n.children.forEach(strip); };
  strip(root);
  return root.children;
}
function normNode(n){
  if (typeof n === 'string') return {name: n};
  const name = n.name ?? n.path ?? '';
  if (Array.isArray(n.children)) return {name, children: n.children.map(normNode)};
  return {name};
}
function normalizeJson(data){
  if (Array.isArray(data)){
    if (data.every(x => typeof x === 'string')) return treeFromPaths(data);
    return data.map(normNode);
  }
  if (data && Array.isArray(data.children)) return data.children.map(normNode);
  if (data && Array.isArray(data.files))    return treeFromPaths(data.files);
  throw new Error('index.json 格式无法识别');
}
async function loadFromJson(){
  const res = await fetch('index.json', {cache: 'no-cache'});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return {nodes: normalizeJson(await res.json()), label: 'index.json'};
}
function parseTree(txt){
  const root = [];
  const stack = [{depth: -1, children: root}];
  let started = false;
  for (const raw of txt.split(/\r?\n/)){
    const line = raw.replace(/\s+$/, '');
    if (!started){ if (line.trim() === 'E:.') started = true; continue; }
    if (!line.trim()) continue;
    const md = line.match(/^((?:\|   |    )*)([+\\])---(.*)$/);
    if (md){
      const depth = md[1].length / 4;
      const name  = md[3].trim();
      while (stack.length > 1 && stack[stack.length - 1].depth >= depth) stack.pop();
      const node = {name, children: []};
      stack[stack.length - 1].children.push(node);
      stack.push({depth, children: node.children});
      continue;
    }
    const mf = line.match(/^((?:\|   |    )*)(.+)$/);
    if (!mf) continue;
    const depth = mf[1].length / 4 - 1;
    const name  = mf[2].trim();
    if (!name) continue;
    while (stack.length > 1 && stack[stack.length - 1].depth >= depth) stack.pop();
    stack[stack.length - 1].children.push({name});
  }
  return root;
}
async function loadFromTxt(){
  const res = await fetch('folder_structure.txt', {cache: 'no-cache'});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const buf = await res.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('\uFFFD')){
    try { text = new TextDecoder('gbk').decode(buf); } catch(_){}
  }
  return {nodes: parseTree(text), label: 'folder_structure.txt'};
}
const LOADERS = {
  'api': loadFromAPI,
  'index.json': loadFromJson,
  'folder_structure.txt': loadFromTxt
};
async function loadAll(){
  const errors = [];
  let rules = [];
  if (CONFIG.applyIgnoreFile){
    rules = await loadIgnoreRules(CONFIG.ignoreFile || '.indexignore');
  }
  for (const src of CONFIG.sources){
    const fn = LOADERS[src];
    if (!fn) continue;
    try{
      const result = await fn();
      if (!result || !result.nodes || !result.nodes.length){
        errors.push(`${src}: 空结果`); continue;
      }
      let nodes = filterTree(result.nodes, '', rules);
      let label = result.label;
      if (rules.length) label += ` · ${CONFIG.ignoreFile}(${rules.length})`;
      if (!nodes.length){ errors.push(`${src}: 应用排除规则后为空`); continue; }
      return {nodes, label};
    } catch(e){
      errors.push(`${src}: ${e.message}`);
      console.warn('[索引] 数据源失败：' + src, e);
    }
  }
  throw new Error(errors.join(' ｜ '));
}

/* ============================================================
   通用排序 / 大小统计
   ============================================================ */
function sortTree(nodes){
  nodes.sort((a, b) => {
    const ad = !!a.children, bd = !!b.children;
    if (ad !== bd) return ad ? -1 : 1;
    return a.name.localeCompare(b.name, 'zh-CN', {numeric: true});
  });
  for (const n of nodes) if (n.children) sortTree(n.children);
}
function sortChildren(nodes, key, dir){
  const copy = [...nodes];
  copy.sort((a, b) => {
    const ad = !!a.children, bd = !!b.children;
    if (ad !== bd) return ad ? -1 : 1;
    let c = 0;
    if (key === 'name'){
      c = a.name.localeCompare(b.name, 'zh-CN', {numeric: true});
    } else if (key === 'type'){
      const at = typeLabelFor(a, ''), bt = typeLabelFor(b, '');
      c = at.localeCompare(bt, 'zh-CN');
      if (c === 0) c = a.name.localeCompare(b.name, 'zh-CN', {numeric: true});
    }
    return dir === 'desc' ? -c : c;
  });
  return copy;
}
function countFiles(node){
  if (!node.children) return 1;
  let n = 0;
  for (const c of node.children) n += countFiles(c);
  return n;
}
function fileUrl(path){
  return path.split('/').map(encodeURIComponent).join('/');
}
function getNodeByPath(nodes, path){
  if (!path || !path.length) return {name: '', children: nodes};
  const [head, ...rest] = path;
  const node = nodes.find(n => n.name === head && n.children);
  if (!node) return null;
  return rest.length ? getNodeByPath(node.children, rest) : node;
}

/* ============================================================
   树形视图
   ============================================================ */
const treeEl = document.getElementById('tree');
const expandBtn   = document.getElementById('expandAll');
const collapseBtn = document.getElementById('collapseAll');
let dirCache = null;
let filteringTree = false;
let treeSaveTimer = null;

function renderTreeNode(node, parentPath, depth){
  if (!node.children){
    const p = parentPath ? parentPath + '/' + node.name : node.name;
    const link = linkMap[p];
    if (link && link.type === 'url'){
      return `<a class="file ext-link" href="${esc(link.target)}" target="_blank" rel="noopener"` +
             ` data-path="${esc(p.toLowerCase())}" title="${esc(p)} → ${esc(link.target)}">` +
             `<span class="ic">🌐</span>` +
             `<span class="nm">${esc(node.name)}</span>` +
             `<span class="ext-badge">↗</span></a>`;
    }
    if (link && (link.type === 'app' || link.type === 'dir')){
      return `<a class="file local-link" href="#"` +
             ` data-path="${esc(p.toLowerCase())}"` +
             ` data-link="${esc(link.type)}"` +
             ` data-target="${esc(link.target)}"` +
             ` title="${esc(p)} → ${esc(link.target)}">` +
             `<span class="ic">${link.type === 'dir' ? '📂' : '🖥️'}</span>` +
             `<span class="nm">${esc(node.name)}</span>` +
             `<span class="ext-badge local">本地</span></a>`;
    }
    return `<a class="file" href="${fileUrl(p)}" target="_blank" rel="noopener"` +
           ` data-path="${esc(p.toLowerCase())}" title="${esc(p)}">` +
           `<span class="ic">${iconFor(node.name)}</span>` +
           `<span class="nm">${esc(node.name)}</span></a>`;
  }
  const p = parentPath ? parentPath + '/' + node.name : node.name;
  return `<details class="dir" data-depth="${depth}" data-path="${esc(p)}">` +
    `<summary><span>${depth === 0 ? '📂' : '📁'}</span>` +
    `<span class="nm">${esc(node.name)}</span>` +
    `<span class="cnt">${countFiles(node)}</span></summary>` +
    `<div class="kids">${node.children.map(k => renderTreeNode(k, p, depth + 1)).join('')}</div>` +
    `</details>`;
}

function loadTreeState(){ return lsGet(STORAGE.tree, {}); }
function saveTreeState(){
  clearTimeout(treeSaveTimer);
  treeSaveTimer = setTimeout(() => {
    if (filteringTree) return;
    const state = loadTreeState();
    treeEl.querySelectorAll('details.dir').forEach(d => state[d.dataset.path] = d.open);
    lsSet(STORAGE.tree, state);
  }, 150);
}
function applyTreeState(){
  const state = loadTreeState();
  treeEl.querySelectorAll('details.dir').forEach(d => {
    d.open = (d.dataset.path in state) ? !!state[d.dataset.path] : false;
  });
}
function updateTreeButtons(){
  expandBtn.disabled   = filteringTree;
  collapseBtn.disabled = filteringTree;
  const tip = filteringTree ? '搜索中不可用，清空搜索后可用' : '';
  expandBtn.title   = tip || '全部展开';
  collapseBtn.title = tip || '全部收起';
}
function setAllTreeOpen(open){
  if (filteringTree) return;
  const state = loadTreeState();
  treeEl.querySelectorAll('details.dir').forEach(d => {
    d.open = open;
    state[d.dataset.path] = open;
  });
  lsSet(STORAGE.tree, state);
}
treeEl.addEventListener('toggle', e => {
  if (!(e.target instanceof HTMLDetailsElement)) return;
  if (!e.target.classList.contains('dir')) return;
  if (filteringTree) return;
  saveTreeState();
}, true);

treeEl.addEventListener('click', e => {
  const a = e.target.closest('a.local-link');
  if (!a) return;
  e.preventDefault();
  const target = a.dataset.target || '';
  const type = a.dataset.link;
  if (!target){
    showToast('该快捷方式尚未配置目标路径，请在 lnk.json 中补充');
    return;
  }
  copyText(target);
  showToast(`已复制${type === 'dir' ? '文件夹' : '程序'}路径：${target}`);
});

function filterTreeView(q){
  q = q.trim().toLowerCase();
  const files = treeEl.querySelectorAll('a.file');
  if (!dirCache) dirCache = Array.from(treeEl.querySelectorAll('details.dir'));

  if (!q){
    filteringTree = false;
    files.forEach(f => f.classList.remove('hide'));
    dirCache.forEach(d => d.classList.remove('hide'));
    applyTreeState();
    updateTreeButtons();
    return true;
  }

  filteringTree = true;
  updateTreeButtons();

  let visible = 0;
  files.forEach(f => {
    const hit = f.dataset.path.includes(q);
    f.classList.toggle('hide', !hit);
    if (hit) visible++;
  });

  const sorted = dirCache.slice().sort(
    (a, b) => Number(b.dataset.depth) - Number(a.dataset.depth)
  );
  for (const d of sorted){
    let has = false;
    for (const f of d.querySelectorAll('a.file')){
      if (!f.classList.contains('hide')){ has = true; break; }
    }
    d.classList.toggle('hide', !has);
    if (has) d.open = true;
  }
  return visible > 0;
}

/* ============================================================
   资源管理器视图
   ============================================================ */
const explorerEl  = document.getElementById('explorer');
const sidebarEl   = document.getElementById('expSidebar');
const mainEl      = document.getElementById('expMain');
const breadcrumbEl= document.getElementById('breadcrumb');
const sortSelect  = document.getElementById('sortSelect');
const navBack     = document.getElementById('navBack');
const navForward  = document.getElementById('navForward');
const navUp       = document.getElementById('navUp');

const expState = {
  path: [],
  history: [],
  historyIndex: -1,
  sortKey: 'name',
  sortDir: 'asc',
  viewMode: 'list',
  filter: '',
};

let selectedEl = null;
let selectedIndex = -1;

function loadExpState(){
  const saved = lsGet(STORAGE.exp, null);
  const view  = lsGet(STORAGE.expView, 'list');
  if (saved){
    expState.path         = Array.isArray(saved.path) ? saved.path : [];
    expState.history      = Array.isArray(saved.history) ? saved.history : [];
    expState.historyIndex = typeof saved.historyIndex === 'number' ? saved.historyIndex : -1;
    expState.sortKey      = saved.sortKey || 'name';
    expState.sortDir      = saved.sortDir || 'asc';
  }
  expState.viewMode = view === 'icon' ? 'icon' : 'list';
  expState.filter = '';
}
function saveExpState(){
  lsSet(STORAGE.exp, {
    path: expState.path,
    history: expState.history,
    historyIndex: expState.historyIndex,
    sortKey: expState.sortKey,
    sortDir: expState.sortDir,
  });
}
function pathExists(path){
  if (!path.length) return true;
  const node = getNodeByPath(currentData.nodes, path);
  return !!(node && node.children);
}
function navigate(path, pushHistory = true){
  if (!pathExists(path)) return;
  expState.path = [...path];
  if (pushHistory){
    expState.history = expState.history.slice(0, expState.historyIndex + 1);
    expState.history.push([...path]);
    expState.historyIndex = expState.history.length - 1;
  }
  saveExpState();
  renderExplorer();
}
function goBack(){
  if (expState.historyIndex > 0){
    expState.historyIndex--;
    expState.path = [...expState.history[expState.historyIndex]];
    saveExpState();
    renderExplorer();
  }
}
function goForward(){
  if (expState.historyIndex < expState.history.length - 1){
    expState.historyIndex++;
    expState.path = [...expState.history[expState.historyIndex]];
    saveExpState();
    renderExplorer();
  }
}
function goUp(){
  if (expState.path.length){
    navigate(expState.path.slice(0, -1));
  }
}

function getItems(){
  return Array.from(mainEl.querySelectorAll('tr[data-path], .icon-item[data-path]'));
}
function selectItem(index, scroll = true){
  const items = getItems();
  if (!items.length){ selectedIndex = -1; return; }
  selectedIndex = Math.max(0, Math.min(index, items.length - 1));
  if (selectedEl) selectedEl.classList.remove('selected');
  selectedEl = items[selectedIndex];
  selectedEl.classList.add('selected');
  if (scroll) selectedEl.scrollIntoView({block: 'nearest'});
}

function openItem(el){
  if (!el) return;
  const path = el.dataset.path;
  const link = linkMap[path];
  if (link && link.type === 'url'){
    window.open(link.target, '_blank', 'noopener');
    return;
  }
  if (link && (link.type === 'app' || link.type === 'dir')){
    if (!link.target){
      showToast('该快捷方式尚未配置目标路径，请在 lnk.json 中补充');
      return;
    }
    copyText(link.target);
    showToast(`已复制${link.type === 'dir' ? '文件夹' : '程序'}路径：${link.target}`);
    return;
  }
  if (el.dataset.isDir === 'true'){
    navigate(path.split('/'));
  } else {
    window.open(fileUrl(path), '_blank', 'noopener');
  }
}

function renderSidebar(currentPath){
  const curStr = currentPath.join('/');
  const render = (nodes, parentPath) => nodes.map(n => {
    if (!n.children) return '';
    const p = parentPath ? parentPath + '/' + n.name : n.name;
    const isCurrent = p === curStr;
    const isAncestor = curStr === '' ? false : curStr.startsWith(p + '/');
    const open = isAncestor || isCurrent ? ' open' : '';
    const sel = isCurrent ? ' selected' : '';
    return `<details class="nav-dir" data-path="${esc(p)}"${open}>` +
      `<summary class="${sel.trim()}">${isCurrent ? '📂' : '📁'} ` +
      `<span class="nav-name">${esc(n.name)}</span></summary>` +
      `<div class="nav-kids">${render(n.children, p)}</div>` +
      `</details>`;
  }).join('');
  sidebarEl.innerHTML = render(currentData.nodes, '');
}

function renderBreadcrumb(path){
  let html = `<span class="crumb${path.length ? '' : ' current'}" data-crumb="">📁 根目录</span>`;
  path.forEach((seg, i) => {
    const isLast = i === path.length - 1;
    html += `<span class="crumb-sep">›</span>`;
    html += `<span class="crumb${isLast ? ' current' : ''}" data-crumb="${esc(path.slice(0, i + 1).join('/'))}">${esc(seg)}</span>`;
  });
  breadcrumbEl.innerHTML = html;
}

function renderContent(node, filter){
  const curPath = expState.path;
  const children = node && node.children ? node.children : [];
  const filtered = filter
    ? children.filter(c => {
        const full = (curPath.join('/') + '/' + c.name).toLowerCase();
        return full.includes(filter);
      })
    : children;

  const sorted = sortChildren(filtered, expState.sortKey, expState.sortDir);

  if (!sorted.length){
    mainEl.innerHTML = `<div class="exp-empty">${filter ? '没有匹配的项目' : '此文件夹为空'}</div>`;
    return;
  }

  if (expState.viewMode === 'icon'){
    mainEl.innerHTML = `<div class="icon-view">${sorted.map(c => {
      const p = (curPath.join('/') + '/' + c.name).replace(/^\//, '');
      const isDir = !!c.children;
      const link = linkMap[p];
      const linkType = link ? link.type : '';
      return `<div class="icon-item" data-path="${esc(p)}" data-is-dir="${isDir}"` +
        (linkType ? ` data-link="${esc(linkType)}"` : '') +
        ` title="${esc(p)}">` +
        `<span class="big-icon">${iconForNode(c, p)}</span>` +
        `<span class="icon-label">${esc(c.name)}</span></div>`;
    }).join('')}</div>`;
  } else {
    const arrowFor = key => {
      if (expState.sortKey !== key) return '';
      return expState.sortDir === 'asc' ? ' ▲' : ' ▼';
    };
    mainEl.innerHTML = `<table class="list-view">
      <thead><tr>
        <th class="col-name" data-sort="name">名称${arrowFor('name')}</th>
        <th class="col-type" data-sort="type">类型${arrowFor('type')}</th>
      </tr></thead>
      <tbody>${sorted.map(c => {
        const p = (curPath.join('/') + '/' + c.name).replace(/^\//, '');
        const isDir = !!c.children;
        const link = linkMap[p];
        const linkType = link ? link.type : '';
        return `<tr data-path="${esc(p)}" data-is-dir="${isDir}"` +
          (linkType ? ` data-link="${esc(linkType)}"` : '') + `>
          <td class="name-cell"><span class="ic">${iconForNode(c, p)}</span>` +
          `<span class="nm">${esc(c.name)}</span></td>
          <td class="type-cell">${typeLabelFor(c, p)}</td></tr>`;
      }).join('')}</tbody>
    </table>`;
  }
}

function renderExplorer(){
  const node = getNodeByPath(currentData.nodes, expState.path);
  if (!node){
    expState.path = [];
    expState.filter = '';
    return renderExplorer();
  }
  renderSidebar(expState.path);
  renderBreadcrumb(expState.path);
  renderContent(node, expState.filter.toLowerCase());

  navBack.disabled = expState.historyIndex <= 0;
  navForward.disabled = expState.historyIndex >= expState.history.length - 1;
  navUp.disabled = expState.path.length === 0;

  sortSelect.value = `${expState.sortKey}-${expState.sortDir}`;
  document.querySelectorAll('[data-exp-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.expView === expState.viewMode);
  });

  selectedEl = null;
  selectedIndex = -1;
}

sidebarEl.addEventListener('click', e => {
  const sum = e.target.closest('summary');
  if (!sum) return;
  e.preventDefault();
  const details = sum.parentElement;
  details.open = true;
  navigate(details.dataset.path.split('/'));
});

breadcrumbEl.addEventListener('click', e => {
  const crumb = e.target.closest('[data-crumb]');
  if (!crumb || crumb.classList.contains('current')) return;
  const p = crumb.dataset.crumb;
  navigate(p ? p.split('/') : []);
});

mainEl.addEventListener('click', e => {
  const col = e.target.closest('th[data-sort]');
  if (col){
    const key = col.dataset.sort;
    if (expState.sortKey === key){
      expState.sortDir = expState.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      expState.sortKey = key;
      expState.sortDir = 'asc';
    }
    saveExpState();
    renderExplorer();
    return;
  }
  const item = e.target.closest('tr[data-path], .icon-item[data-path]');
  if (selectedEl) selectedEl.classList.remove('selected');
  if (item){
    item.classList.add('selected');
    selectedEl = item;
    selectedIndex = getItems().indexOf(item);
  } else {
    selectedEl = null;
    selectedIndex = -1;
  }
});

mainEl.addEventListener('dblclick', e => {
  const item = e.target.closest('tr[data-path], .icon-item[data-path]');
  if (!item) return;
  openItem(item);
});

navBack.addEventListener('click', goBack);
navForward.addEventListener('click', goForward);
navUp.addEventListener('click', goUp);

sortSelect.addEventListener('change', () => {
  const [key, dir] = sortSelect.value.split('-');
  expState.sortKey = key;
  expState.sortDir = dir;
  saveExpState();
  renderExplorer();
});

document.querySelectorAll('[data-exp-view]').forEach(b => {
  b.addEventListener('click', () => {
    expState.viewMode = b.dataset.expView;
    lsSet(STORAGE.expView, expState.viewMode);
    renderExplorer();
  });
});

/* ============================================================
   视图切换
   ============================================================ */
function setMainView(view){
  if (view !== 'tree' && view !== 'explorer') return;
  document.body.dataset.view = view;
  lsSet(STORAGE.view, view);

  const treeVisible = view === 'tree';
  treeEl.hidden = !treeVisible;
  explorerEl.hidden = treeVisible;

  if (treeVisible){
    if (!dirCache) dirCache = Array.from(treeEl.querySelectorAll('details.dir'));
    applyTreeState();
    if (qInput.value) filterTreeView(qInput.value);
    else updateTreeButtons();
  } else {
    renderExplorer();
    if (qInput.value){
      expState.filter = qInput.value;
      renderExplorer();
    }
  }
}

/* ============================================================
   全局状态 & 数据
   ============================================================ */
let currentData = {nodes: [], label: ''};

/* ============================================================
   搜索
   ============================================================ */
const qInput = document.getElementById('q');
let searchTimer = null;

function runSearch(){
  const q = qInput.value;
  const scope = lsGet(STORAGE.searchScope, 'current');
  const emptyEl = document.getElementById('empty');

  if (document.body.dataset.view === 'tree'){
    const ok = filterTreeView(q);
    emptyEl.hidden = ok || !q;
    return;
  }

  if (scope === 'all' && q.trim()){
    setMainView('tree');
    const ok = filterTreeView(q);
    emptyEl.hidden = ok;
    return;
  }
  expState.filter = q;
  renderExplorer();
}

qInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 110);
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qInput &&
      !document.getElementById('settings').open){
    e.preventDefault(); qInput.focus(); qInput.select();
  }
  if (e.key === 'Escape' && document.activeElement === qInput){
    qInput.value = ''; runSearch(); qInput.blur();
  }
});

/* ============================================================
   设置对话框
   ============================================================ */
const settingsDlg = document.getElementById('settings');
document.getElementById('openSettings').addEventListener('click', () => {
  document.querySelectorAll('input[name="mainView"]').forEach(r => {
    r.checked = r.value === document.body.dataset.view;
  });
  document.getElementById('setExpView').value = expState.viewMode;
  document.getElementById('setSearchScope').value = lsGet(STORAGE.searchScope, 'current');
  settingsDlg.showModal();
});
document.getElementById('closeSettings').addEventListener('click', () => settingsDlg.close());
settingsDlg.addEventListener('click', e => {
  if (e.target === settingsDlg) settingsDlg.close();
});
document.querySelectorAll('input[name="mainView"]').forEach(r => {
  r.addEventListener('change', () => {
    if (r.checked) setMainView(r.value);
  });
});
document.getElementById('setExpView').addEventListener('change', e => {
  expState.viewMode = e.target.value;
  lsSet(STORAGE.expView, expState.viewMode);
  if (document.body.dataset.view === 'explorer') renderExplorer();
});
document.getElementById('setSearchScope').addEventListener('change', e => {
  lsSet(STORAGE.searchScope, e.target.value);
});

/* ============================================================
   资源管理器键盘导航
   ============================================================ */
document.addEventListener('keydown', e => {
  if (document.body.dataset.view !== 'explorer') return;
  if (settingsDlg.open) return;

  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' ||
            a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;

  if (e.key === 'ArrowDown'){
    e.preventDefault();
    const items = getItems();
    if (!items.length) return;
    selectItem(selectedIndex < 0 ? 0 : Math.min(selectedIndex + 1, items.length - 1));
  } else if (e.key === 'ArrowUp'){
    e.preventDefault();
    const items = getItems();
    if (!items.length) return;
    selectItem(selectedIndex < 0 ? items.length - 1 : Math.max(selectedIndex - 1, 0));
  } else if (e.key === 'Home'){
    e.preventDefault();
    selectItem(0);
  } else if (e.key === 'End'){
    e.preventDefault();
    selectItem(getItems().length - 1);
  } else if (e.key === 'Enter'){
    if (selectedEl){
      e.preventDefault();
      openItem(selectedEl);
    }
  } else if (e.key === 'Backspace'){
    if (expState.path.length){
      e.preventDefault();
      goUp();
    }
  }
});

/* ============================================================
   启动
   ============================================================ */
(async function init(){
  const statusEl = document.getElementById('status');
  const srcEl    = document.getElementById('src');

  try{
    try{
      linkMap = normalizeLinkMap(await loadLinkMap());
    } catch(_){ linkMap = {}; }

    const {nodes, label} = await loadAll();
    sortTree(nodes);
    currentData = {nodes, label};

    treeEl.innerHTML = nodes.map(n => renderTreeNode(n, '', 0)).join('');
    applyTreeState();

    loadExpState();
    if (!pathExists(expState.path)) expState.path = [];
    if (expState.history.length === 0){
      expState.history = [[...expState.path]];
      expState.historyIndex = 0;
    }

    let total = 0;
    for (const n of nodes) total += countFiles(n);
    const linkCount = Object.keys(linkMap).length;
    srcEl.textContent = `${label} · ${total} 个文件` +
      (linkCount ? ` · ${linkCount} 个快捷方式` : '');
    srcEl.classList.add('ok');

    const savedView = lsGet(STORAGE.view, 'tree');
    statusEl.hidden = true;
    setMainView(savedView === 'explorer' ? 'explorer' : 'tree');
    updateTreeButtons();

  } catch(err){
    srcEl.textContent = '加载失败';
    statusEl.innerHTML =
      `<p>❌ 没有可用的数据源</p>` +
      `<p style="margin-top:10px;font-size:12px">${esc(err.message)}</p>` +
      `<p style="margin-top:14px;font-size:12px;color:var(--dim)">` +
      `提示：本地以 <code>file://</code> 打开时无法 fetch，` +
      `请用本地服务器（如 <code>python -m http.server</code>）或直接部署到 GitHub Pages。</p>`;
    console.error(err);
  }
})();

expandBtn.addEventListener('click',   () => setAllTreeOpen(true));
collapseBtn.addEventListener('click', () => setAllTreeClick(false));
</script>
