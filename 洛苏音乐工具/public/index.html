<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛苏音乐 · 三平台点歌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🎵 洛苏点歌</h1>
  <div class="platform-tabs" id="platformTabs">
    <button data-platform="wymusic" class="active">网易云</button>
    <button data-platform="kgmusic">酷狗</button>
    <button data-platform="qqmusic">QQ音乐</button>
  </div>
  <button class="icon-btn" onclick="toggleSettings()" title="设置">⚙️</button>
</header>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>设置</h2>
    <div class="setting-item">
      <label>搜索数量 (t)</label>
      <select id="setLimit">
        <option value="10">10 首</option>
        <option value="20">20 首</option>
        <option value="50">50 首</option>
        <option value="100">100 首</option>
      </select>
    </div>
    <div class="setting-item">
      <label>试听音质 (yz)</label>
      <select id="setQuality">
        <option value="standard">标准 (standard)</option>
        <option value="higher">较高 (higher)</option>
        <option value="exhigh">极高 (exhigh)</option>
        <option value="lossless">无损 (lossless)</option>
      </select>
    </div>
    <div class="setting-item">
      <label>下载音质 (yz)</label>
      <select id="setDownloadQuality">
        <option value="exhigh">极高 (exhigh)</option>
        <option value="lossless">无损 (lossless)</option>
        <option value="hires">Hi-Res (hires)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button onclick="saveSettings()">保存设置</button>
    </div>
  </div>
</div>

<main>
  <aside>
    <div class="search-box">
      <input id="keyword" type="text" placeholder="输入歌名或歌手…"
             onkeydown="if(event.key==='Enter')doSearch()">
      <button id="searchBtn" onclick="doSearch()">搜索</button>
    </div>
    <div class="result-list" id="resultList">
      <div class="placeholder">选择平台，输入关键词搜索</div>
    </div>
  </aside>

  <section class="player-area">
    <div class="now-playing">
      <img class="cover" id="cover"
           src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect fill='%23222' width='48' height='48'/%3E%3Ctext x='24' y='30' text-anchor='middle' fill='%23555' font-size='16'%3E♪%3C/text%3E%3C/svg%3E"
           onerror="if(!this.dataset.retried && this.src.startsWith('http')) { this.dataset.retried='1'; this.src='/img-proxy?url=' + encodeURIComponent(this.src); }"
           alt="cover">
      <div class="info">
        <div class="name" id="nowName">未播放</div>
        <div class="artist" id="nowArtist">—</div>
        <audio id="audio" controls preload="none"></audio>
      </div>
      <button class="icon-btn" onclick="downloadCurrent()" title="下载当前歌曲" id="downloadBtn" disabled>⬇️</button>
    </div>
    <div class="lyric-area" id="lyricArea">
      <div class="placeholder">歌词将在这里显示</div>
    </div>
    <div class="status-bar">
      <span id="status">就绪</span>
      <span id="apiHint">localhost:3000</span>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
